<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Taupō 70.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0D1A21;        /* Lake Taupō at night */
  --surface: #13232C;
  --raised: #182C37;
  --rule: #23363F;
  --ink: #EDE9E0;       /* pumice */
  --ink-2: #AEBAC0;
  --ink-3: #82939C;
  --swim: #3987E0;
  --bike: #1FA37A;
  --run: #E0662F;
  --other: #5E707A;
  --go: #0CA30C;
  --easy: #FAB219;
  --rest: #D03B3B;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --text: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --gutter: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--text);
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter) 48px; }

/* header */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) 0 14px;
}
.race-tag { display: flex; align-items: baseline; gap: 10px; }
.race-tag b { font: 800 22px/1 var(--display); letter-spacing: .01em; }
.race-tag span { color: var(--ink-2); font-size: 14px; }
.top-right { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; }
.btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.btn:hover { background: var(--raised); }
.banner {
  margin: 0 0 14px; padding: 10px 14px; border-radius: 8px;
  background: var(--raised); color: var(--ink-2); font-size: 13px;
}
.banner code { color: var(--ink); }

/* hero */
.hero {
  position: relative; display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px;
  background: var(--surface); border-radius: 20px; padding: 28px 28px 24px 34px; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--status, var(--ink-3));
}
.verdict-word {
  font: 900 clamp(84px, 17vw, 176px)/.82 var(--display);
  text-transform: uppercase; letter-spacing: -.01em; margin: 0;
  display: flex; align-items: flex-start; gap: 14px;
}
.verdict-word svg { width: .32em; height: .32em; margin-top: .06em; color: var(--status); flex: none; }
.verdict-line { font-size: 17px; font-weight: 500; margin: 14px 0 6px; max-width: 34ch; }
.reasons { margin: 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14px; }
.reasons li::before { content: "– "; color: var(--ink-3); }
.vitals { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 22px; }
.vital { min-width: 92px; }
.vital .n { font: 800 34px/1 var(--display); }
.vital .n small { font: 500 14px var(--text); color: var(--ink-2); margin-left: 3px; }
.vital .l { font-size: 13px; color: var(--ink-3); }
.vital .d { font-size: 13px; color: var(--ink-2); }

.today h2, .section h2 { font: 600 15px/1.3 var(--text); margin: 0 0 12px; color: var(--ink); }
.today { display: flex; flex-direction: column; gap: 10px; }
.session {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px; align-items: start;
  background: var(--raised); border-radius: 10px; padding: 12px 14px 12px 0;
}
.session .bar { width: 4px; align-self: stretch; border-radius: 0 3px 3px 0; background: var(--c); }
.session .name { font-weight: 600; }
.session .meta { color: var(--ink-2); font-size: 13px; }
.session .when { font: 800 22px/1 var(--display); text-align: right; }
.session details { grid-column: 2 / 4; margin-top: 6px; }
.session summary { cursor: pointer; color: var(--ink-3); font-size: 13px; }
.session pre {
  margin: 6px 0 0; white-space: pre-wrap; font: 400 13px/1.55 var(--text); color: var(--ink-2);
}
.session.is-done .name::after { content: "Done"; margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--go); }
.next { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.next b { color: var(--ink); font-weight: 600; }
.empty { color: var(--ink-2); font-size: 14px; padding: 12px 0; }

/* sections */
.section { margin-top: 36px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { margin: 0; }
.section-head span { color: var(--ink-3); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--rule); }
.day { padding: 10px 8px 14px 0; min-height: 112px; border-right: 1px solid var(--rule); }
.day + .day { padding-left: 10px; }
.day:last-child { border-right: 0; }
.day-name { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
.day-name b { font: 800 20px/1 var(--display); color: var(--ink-2); margin-right: 4px; }
.day.is-today .day-name, .day.is-today .day-name b { color: var(--ink); }
.day.is-today { box-shadow: inset 0 3px 0 var(--ink); }
.chip { display: flex; gap: 7px; align-items: flex-start; font-size: 13px; line-height: 1.3; margin-bottom: 8px; }
.chip i { flex: none; width: 9px; height: 9px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--c); }
.chip.done i { background: var(--c); }
.chip.missed { color: var(--ink-3); text-decoration: line-through; }
.chip.missed i { opacity: .5; }
.chip small { display: block; color: var(--ink-3); text-decoration: none; }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--ink-3); font-size: 12px; }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-2); }
.key i.f { background: var(--ink-2); }

/* recovery sparklines */
.spark-row { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.spark-row:last-of-type { border-bottom: 1px solid var(--rule); }
.spark-label .n { font: 800 26px/1 var(--display); }
.spark-label .n small { font: 500 13px var(--text); color: var(--ink-2); margin-left: 2px; }
.spark-label .l { font-size: 13px; color: var(--ink-3); }
.spark { height: 64px; position: relative; }
.spark svg, .chart svg { display: block; overflow: visible; }

/* load */
.chart { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend i.ghost { background: none; border: 1.5px dashed var(--ink-3); }
.split { margin-top: 18px; }
.split-row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.split-row b { font-weight: 600; color: var(--ink); text-align: right; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--rule); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--ink-2); }
.track .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); left: 80%; }
.split-note { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.fff { display: flex; gap: 28px; margin-top: 20px; flex-wrap: wrap; }
.fff .n { font: 800 28px/1 var(--display); }
.fff .l { font-size: 13px; color: var(--ink-3); }
.warns { list-style: none; padding: 0; margin: 18px 0 0; }
.warns li { display: flex; gap: 8px; font-size: 14px; color: var(--ink-2); margin-top: 8px; }
.warns svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--easy); }

/* race strip */
.race-days { font: 900 clamp(56px, 11vw, 112px)/.85 var(--display); }
.race-days small { font: 500 15px var(--text); color: var(--ink-2); margin-left: 8px; }
.strip { display: flex; gap: 3px; margin-top: 18px; }
.leg { min-width: 0; }
.leg .t { height: 14px; background: var(--rule); position: relative; overflow: hidden; }
.leg:first-child .t { border-radius: 7px 0 0 7px; }
.leg:last-child .t { border-radius: 0 7px 7px 0; }
.leg .t span { position: absolute; inset: 0 auto 0 0; background: var(--c); width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
.leg .lab { padding-top: 8px; font-size: 13px; color: var(--ink-2); padding-right: 6px; }
.leg .lab b { display: block; color: var(--ink); font-weight: 600; }
.leg-labels { display: none; }
.race-note { color: var(--ink-3); font-size: 13px; margin-top: 12px; max-width: 70ch; }

/* tables + tooltip */
details.table { margin-top: 10px; font-size: 13px; color: var(--ink-3); }
details.table summary { cursor: pointer; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; color: var(--ink-2); }
th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); font-weight: 400; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-3); }
.tip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--raised); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; font-size: 13px; line-height: 1.4;
  box-shadow: 0 6px 20px rgba(0,0,0,.35); opacity: 0; transition: opacity .08s; white-space: nowrap;
}
.tip.on { opacity: 1; }

/* access gate + states */
.gate { max-width: 360px; margin: 18vh auto 0; }
.gate h1 { font: 900 56px/.9 var(--display); margin: 0 0 12px; text-transform: uppercase; }
.gate p { color: var(--ink-2); }
.gate form { display: flex; gap: 8px; margin-top: 16px; }
.gate input { flex: 1; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
.gate .err { color: #F08A8A; font-size: 14px; min-height: 1.5em; }
.state { padding: 60px 0; color: var(--ink-2); }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; padding: 22px 20px 20px 26px; gap: 22px; }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-2 > * + * { margin-top: 36px; }
  .week { grid-template-columns: 1fr; }
  .day { display: grid; grid-template-columns: 70px 1fr; min-height: 0; border-right: 0; border-bottom: 1px solid var(--rule); padding: 10px 0 4px; }
  .day + .day { padding-left: 0; }
  .day.is-today { box-shadow: inset 3px 0 0 var(--ink); padding-left: 10px; }
  .top-right .upd { display: none; }
  .leg .lab { display: none; }
  .leg-labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 10px; font-size: 13px; color: var(--ink-2); }
  .leg-labels b { display: block; color: var(--ink); font-weight: 600; }
}
@media (prefers-reduced-motion: reduce) {
  .leg .t span, .tip { transition: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Loading your numbers…</div></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
// ---------------------------------------------------------------------------
// CONFIG: paste your Cloud Function URL here after you deploy it.
// Leave it empty to see the demo data.
const API_URL = "https://australia-southeast1-arena-scout-492406.cloudfunctions.net/tri-dashboard";
// ---------------------------------------------------------------------------

const DEMO = /*DEMO_JSON*/null;

const SPORT_VAR = { Swim: "var(--swim)", Bike: "var(--bike)", Run: "var(--run)", Other: "var(--other)" };
const SPORTS = ["Swim", "Bike", "Run", "Other"];
const STATUS_VAR = { go: "var(--go)", easy: "var(--easy)", rest: "var(--rest)", unknown: "var(--ink-3)" };
const ICONS = {
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>',
  easy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M7 12h10"/></svg>',
  rest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M10 8v8M14 8v8"/></svg>',
  unknown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dt = iso => new Date(iso + "T00:00:00");
const dayShort = iso => dt(iso).toLocaleDateString("en-NZ", { weekday: "short" });
const dayLong = iso => dt(iso).toLocaleDateString("en-NZ", { weekday: "long", day: "numeric", month: "short" });
const fmtMin = m => !m ? "" : m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
const fmtH = h => `${(h || 0).toFixed(1)}h`;
const addDays = (iso, n) => { const d = dt(iso); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let DATA = null;

// ---------------------------------------------------------------- loading
async function load() {
  const demo = !API_URL || new URLSearchParams(location.search).has("demo");
  if (demo) {
    if (!DEMO) { $("#app").innerHTML = '<div class="state">Paste your Cloud Function URL into <code>API_URL</code> at the top of the script, then reload.</div>'; return; }
    DATA = DEMO; render(true); return;
  }
  const token = store.get("dashToken");
  if (!token) { gate(); return; }
  $("#app").innerHTML = '<div class="state">Loading your numbers…</div>';
  try {
    const r = await fetch(API_URL, { headers: { "X-Dash-Token": token }, cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { store.del("dashToken"); gate("That code didn't work. Check DASH_TOKEN on the function."); return; }
    if (!r.ok) throw new Error(body.error || `Error ${r.status}`);
    DATA = body; render(false);
  } catch (e) {
    $("#app").innerHTML = `<div class="state">Couldn't load your data: ${esc(e.message)}<br><br><button class="btn" onclick="load()">Try again</button></div>`;
  }
}

function gate(msg = "") {
  $("#app").innerHTML = `
    <div class="gate">
      <h1>Taupō 70.3</h1>
      <p>Enter the access code you set as DASH_TOKEN on your function. It's saved on this device.</p>
      <form id="gate"><label class="sr" for="code" hidden>Access code</label>
        <input id="code" type="password" autocomplete="current-password" placeholder="Access code" aria-label="Access code" required>
        <button class="btn" type="submit">Unlock</button>
      </form>
      <div class="err" role="alert">${esc(msg)}</div>
    </div>`;
  $("#gate").addEventListener("submit", e => {
    e.preventDefault(); store.set("dashToken", $("#code").value.trim()); load();
  });
  $("#code").focus();
}

// ---------------------------------------------------------------- render
function render(demo) {
  const d = DATA;
  const updated = new Date(d.generated).toLocaleTimeString("en-NZ", { hour: "numeric", minute: "2-digit" });
  $("#app").innerHTML = `
    <header class="top">
      <div class="race-tag"><b>Taupō 70.3</b><span>${d.race.days_to_go} days to go</span></div>
      <div class="top-right"><span class="upd">Updated ${esc(updated)}</span>
        <button class="btn" onclick="load()">Refresh</button></div>
    </header>
    ${demo ? '<div class="banner">Demo data. Put your function URL in <code>API_URL</code> at the top of the script to see your own numbers.</div>' : ""}
    ${hero(d)}
    <section class="section" aria-labelledby="wk"><div class="section-head"><h2 id="wk">This week</h2><span>${weekTotals(d)}</span></div>${week(d)}</section>
    <div class="grid-2">
      <section class="section" aria-labelledby="rc"><div class="section-head"><h2 id="rc">Recovery</h2><span>Last 14 days, dashed line is your 4-week baseline</span></div><div id="sparks"></div></section>
      <section class="section" aria-labelledby="ld"><div class="section-head"><h2 id="ld">Training load</h2><span>Hours per week</span></div>${loadBlock(d)}</section>
    </div>
    <section class="section" aria-labelledby="rr">${raceBlock(d)}</section>`;
  drawCharts();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".leg .t span").forEach(s => s.style.width = s.dataset.w + "%");
  }));
}

function hero(d) {
  const v = d.verdict, r = d.recovery;
  const todayPlan = matchDay(d, d.today);
  const tomorrow = d.plan.filter(p => p.date === addDays(d.today, 1));
  const delta = (m, unit, invert) => {
    if (m.value == null || m.baseline == null) return "";
    const diff = m.value - m.baseline;
    const txt = unit === "h" ? `${diff >= 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)}h` : `${diff >= 0 ? "+" : "−"}${Math.abs(Math.round(diff))}`;
    return `${txt} vs ${unit === "h" ? m.baseline.toFixed(1) + "h" : Math.round(m.baseline)} baseline`;
  };
  const vital = (val, unit, label, m) => `
    <div class="vital"><div class="n">${val ?? "–"}${val != null ? `<small>${unit}</small>` : ""}</div>
    <div class="l">${label}${m.date && m.date !== d.today ? `, from ${dayShort(m.date)}` : ""}</div><div class="d">${delta(m, unit === "h" ? "h" : "")}</div></div>`;
  return `
  <section class="hero" style="--status:${STATUS_VAR[v.level]}" aria-label="Today">
    <div>
      <p class="verdict-word">${ICONS[v.level]}<span>${esc(v.word)}</span></p>
      <p class="verdict-line">${esc(v.line)}</p>
      ${v.reasons.length ? `<ul class="reasons">${v.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="vitals">
        ${vital(r.hrv.value, "ms", "HRV", r.hrv)}
        ${vital(r.rhr.value, "bpm", "Resting HR", r.rhr)}
        ${vital(r.sleep.value != null ? r.sleep.value.toFixed(1) : null, "h", r.sleep.score ? `Sleep, score ${r.sleep.score}` : "Sleep", r.sleep)}
      </div>
    </div>
    <div class="today">
      <h2>${esc(dayLong(d.today))}</h2>
      ${todayPlan.length ? todayPlan.map(sessionCard).join("") : '<div class="empty">Nothing planned. Rest day.</div>'}
      ${tomorrow.length ? `<div class="next">Tomorrow: ${tomorrow.map(t => `<b>${esc(t.name)}</b> ${fmtMin(t.minutes)}`).join(", ")}</div>` : ""}
    </div>
  </section>`;
}

function sessionCard(s) {
  const meta = [s.sport === "Bike" ? "Bike" : s.sport, s.km ? `${s.km} km` : "", s.state === "done" && s.doneMin ? `did ${fmtMin(s.doneMin)}` : ""].filter(Boolean).join(", ");
  return `<div class="session ${s.state === "done" ? "is-done" : ""}" style="--c:${SPORT_VAR[s.sport]}">
    <span class="bar"></span>
    <div><div class="name">${esc(s.name)}</div><div class="meta">${esc(meta)}</div></div>
    <div class="when">${fmtMin(s.minutes)}</div>
    ${s.steps ? `<details><summary>Steps</summary><pre>${esc(s.steps)}</pre></details>` : ""}
  </div>`;
}

// planned vs done for one day: match by sport, in order
function matchDay(d, iso) {
  const planned = d.plan.filter(p => p.date === iso).map(p => ({ ...p }));
  const done = d.done.filter(a => a.date === iso).map(a => ({ ...a, used: false }));
  for (const p of planned) {
    const a = done.find(x => !x.used && x.sport === p.sport);
    if (a) { a.used = true; p.state = "done"; p.doneMin = a.minutes; }
    else p.state = iso < d.today ? "missed" : "planned";
  }
  const extra = done.filter(a => !a.used).map(a => ({ ...a, state: "done", extra: true, doneMin: a.minutes }));
  return [...planned, ...extra];
}

function weekDays(d) {
  const t = dt(d.today); const dow = (t.getDay() + 6) % 7;
  return Array.from({ length: 7 }, (_, i) => addDays(d.today, i - dow));
}

function weekTotals(d) {
  const days = weekDays(d);
  const plannedMin = d.plan.filter(p => days.includes(p.date)).reduce((s, p) => s + (p.minutes || 0), 0);
  const doneMin = d.done.filter(a => days.includes(a.date)).reduce((s, a) => s + (a.minutes || 0), 0);
  return `${fmtH(doneMin / 60)} done of ${fmtH(plannedMin / 60)} planned`;
}

function week(d) {
  const cells = weekDays(d).map(iso => {
    const items = matchDay(d, iso);
    const chips = items.map(s => `
      <div class="chip ${s.state}" style="--c:${SPORT_VAR[s.sport]}"><i aria-hidden="true"></i>
        <div>${esc(s.name)}<small>${s.state === "missed" ? "missed" : fmtMin(s.state === "done" ? s.doneMin : s.minutes)}${s.extra ? ", unplanned" : ""}</small></div></div>`).join("");
    const t = dt(iso);
    return `<div class="day ${iso === d.today ? "is-today" : ""}">
      <div class="day-name"><b>${t.getDate()}</b>${dayShort(iso)}</div>
      <div>${chips || '<div class="chip" style="color:var(--ink-3)">Rest</div>'}</div></div>`;
  }).join("");
  return `<div class="week">${cells}</div>
    <div class="key"><span><i></i>Planned</span><span><i class="f"></i>Done</span>
    ${SPORTS.slice(0, 3).map(s => `<span><i style="border-color:${SPORT_VAR[s]};background:${SPORT_VAR[s]}"></i>${s}</span>`).join("")}</div>`;
}

function loadBlock(d) {
  const L = d.load, last = L.weeks[L.weeks.length - 2];
  const split = (label, pct) => `<div class="split-row"><span>${label}</span>
    <div class="track" role="img" aria-label="${label}: ${pct ?? "no"}% easy, target 80%"><div class="fill" style="width:${pct ?? 0}%"></div><div class="target"></div></div>
    <b>${pct == null ? "–" : pct + "%"}</b></div>`;
  return `
    <div class="legend">${SPORTS.map(s => `<span><i style="--c:${SPORT_VAR[s]}"></i>${s}</span>`).join("")}<span><i class="ghost"></i>Planned this week</span></div>
    <div class="chart" id="loadChart" style="height:220px"></div>
    <details class="table"><summary>Show as table</summary><table>
      <tr><th>Week of</th>${SPORTS.map(s => `<th>${s}</th>`).join("")}<th>Total</th><th>Easy</th></tr>
      ${L.weeks.map(w => `<tr><td>${dt(w.start).toLocaleDateString("en-NZ", { day: "numeric", month: "short" })}</td>${SPORTS.map(s => `<td>${fmtH(w.hours[s])}</td>`).join("")}<td>${fmtH(w.total)}</td><td>${w.easy_pct ?? "–"}${w.easy_pct != null ? "%" : ""}</td></tr>`).join("")}
    </table></details>
    <div class="split">
      ${split("Last week", last.easy_pct)}
      ${split("6 weeks", L.easy_pct_6wk)}
      <div class="split-note">Share of bike and run time in your easy zones. The white tick is the 80% target.</div>
    </div>
    <div class="fff">
      <div><div class="n">${L.fitness ?? "–"}</div><div class="l">Fitness</div></div>
      <div><div class="n">${L.fatigue ?? "–"}</div><div class="l">Fatigue</div></div>
      <div><div class="n">${L.form == null ? "–" : (L.form > 0 ? "+" : "") + L.form}</div><div class="l">Form</div></div>
      <div><div class="n">${L.ramp ?? "–"}</div><div class="l">Ramp per week</div></div>
    </div>
    ${L.warnings.length ? `<ul class="warns">${L.warnings.map(w => `<li>${ICONS.warn}<span>${esc(w)}</span></li>`).join("")}</ul>` : ""}`;
}

function raceBlock(d) {
  const R = d.race, totalH = R.legs.reduce((s, l) => s + l.race_hours, 0);
  const date = dt(R.date).toLocaleDateString("en-NZ", { day: "numeric", month: "long", year: "numeric" });
  return `
    <div class="section-head"><h2 id="rr">Race readiness</h2><span>${esc(R.name)}, ${esc(date)}</span></div>
    <div class="race-days">${R.days_to_go}<small>days to go</small></div>
    <div class="strip" role="img" aria-label="Longest session compared with race distance">
      ${R.legs.map(l => `<div class="leg" style="flex:${l.race_hours / totalH};--c:${SPORT_VAR[l.sport]}">
        <div class="t"><span data-w="${l.pct}"></span></div>
        <div class="lab"><b>${l.sport} ${l.race_km} km</b>${l.longest_km ? `Longest ${l.longest_km} km, ${l.pct}%` : `No ${l.sport === "Bike" ? "ride" : l.sport.toLowerCase()} yet`}</div>
      </div>`).join("")}
    </div>
    <div class="leg-labels">${R.legs.map(l => `<div><b>${l.sport} ${l.race_km} km</b>${l.longest_km ? `Longest ${l.longest_km} km, ${l.pct}%` : `No ${l.sport === "Bike" ? "ride" : l.sport.toLowerCase()} yet`}</div>`).join("")}</div>
    <p class="race-note">Each leg is sized by roughly how long it takes on race day. The fill is your longest single session in the last 6 weeks against the race distance.</p>`;
}

// ---------------------------------------------------------------- charts (plain SVG)
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function tipOn(e, html) { const t = $("#tip"); t.innerHTML = html; t.classList.add("on"); tipMove(e); }
function tipMove(e) {
  const t = $("#tip"), pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + pad, y = e.clientY - h - pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y < 8) y = e.clientY + pad;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function tipOff() { $("#tip").classList.remove("on"); }

function drawCharts() {
  if (!DATA) return;
  drawSparks(); drawLoad();
}

function drawSparks() {
  const host = $("#sparks"); if (!host) return;
  const r = DATA.recovery;
  const rows = [
    { key: "hrv", label: "HRV", unit: "ms", fmt: v => Math.round(v) },
    { key: "rhr", label: "Resting HR", unit: "bpm", fmt: v => Math.round(v) },
    { key: "sleep", label: "Sleep", unit: "h", fmt: v => v.toFixed(1) },
  ];
  host.innerHTML = rows.map(row => `<div class="spark-row">
      <div class="spark-label"><div class="n">${r[row.key].value == null ? "–" : row.fmt(r[row.key].value)}<small>${row.unit}</small></div><div class="l">${row.label}</div></div>
      <div class="spark" id="sp-${row.key}"></div></div>`).join("") +
    `<details class="table"><summary>Show as table</summary><table><tr><th>Day</th>${rows.map(x => `<th>${x.label}</th>`).join("")}</tr>
     ${r.hrv.series.map((p, i) => `<tr><td>${dayShort(p.date)} ${dt(p.date).getDate()}</td>${rows.map(x => { const v = r[x.key].series[i].value; return `<td>${v == null ? "–" : x.fmt(v)}</td>`; }).join("")}</tr>`).join("")}
     </table></details>`;

  for (const row of rows) {
    const m = r[row.key], box = $("#sp-" + row.key), W = box.clientWidth, H = 64, P = 6;
    const vals = m.series.map(p => p.value).filter(v => v != null);
    if (!vals.length) { box.innerHTML = '<div class="empty">No data yet</div>'; continue; }
    const all = m.baseline != null ? [...vals, m.baseline] : vals;
    let lo = Math.min(...all), hi = Math.max(...all);
    const padv = (hi - lo) * 0.15 || 1; lo -= padv; hi += padv;
    const n = m.series.length, x = i => P + (W - 2 * P) * i / (n - 1), y = v => P + (H - 2 * P) * (1 - (v - lo) / (hi - lo));
    const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" }, box);
    if (m.baseline != null) el("line", { x1: P, x2: W - P, y1: y(m.baseline), y2: y(m.baseline), stroke: "var(--ink-3)", "stroke-width": 1, "stroke-dasharray": "3 4" }, svg);
    // line with gaps where a night is missing
    let dpath = "", pen = false;
    m.series.forEach((p, i) => { if (p.value == null) { pen = false; return; } dpath += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`; pen = true; });
    el("path", { d: dpath, fill: "none", stroke: "var(--ink)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    const last = m.series.map((p, i) => [p, i]).filter(([p]) => p.value != null).pop();
    if (last) el("circle", { cx: x(last[1]), cy: y(last[0].value), r: 4, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
    // hover: crosshair + tooltip
    const cross = el("line", { y1: 0, y2: H, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" }, svg);
    const dot = el("circle", { r: 4, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
    const hit = el("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", e => {
      const bx = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - bx.left - P) / (W - 2 * P) * (n - 1))));
      const p = m.series[i];
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      if (p.value != null) { dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.value)); dot.setAttribute("visibility", "visible"); } else dot.setAttribute("visibility", "hidden");
      tipOn(e, `<b>${esc(dayShort(p.date))} ${dt(p.date).getDate()}</b><br>${row.label} ${p.value == null ? "no data" : row.fmt(p.value) + " " + row.unit}${m.baseline != null ? `<br><span style="color:var(--ink-3)">Baseline ${row.fmt(m.baseline)}</span>` : ""}`);
    });
    hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tipOff(); });
  }
}

function roundedTop(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function drawLoad() {
  const box = $("#loadChart"); if (!box) return;
  box.innerHTML = "";
  const weeks = DATA.load.weeks, W = box.clientWidth, H = 220, top = 22, bottom = 26, left = 30;
  const days = weekDays(DATA);
  const plannedH = DATA.plan.filter(p => days.includes(p.date)).reduce((s, p) => s + (p.minutes || 0), 0) / 60;
  const maxV = Math.max(4, ...weeks.map(w => w.total), plannedH);
  const step = maxV > 10 ? 4 : 2, yMax = Math.ceil(maxV / step) * step;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" }, box);
  const y = v => top + (H - top - bottom) * (1 - v / yMax);
  for (let v = 0; v <= yMax; v += step) {
    el("line", { x1: left, x2: W, y1: y(v), y2: y(v), stroke: "var(--rule)", "stroke-width": 1 }, svg);
    const t = el("text", { x: left - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--ink-3)", "font-size": 11 }, svg); t.textContent = v + "h";
  }
  const slot = (W - left) / weeks.length, bw = Math.min(44, slot * 0.56);
  weeks.forEach((w, i) => {
    const cx = left + slot * i + slot / 2, x0 = cx - bw / 2, isNow = i === weeks.length - 1;
    if (isNow && plannedH > 0) {
      el("rect", { x: x0 + .75, y: y(plannedH), width: bw - 1.5, height: y(0) - y(plannedH), rx: 4, fill: "none", stroke: "var(--ink-3)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, svg);
    }
    let acc = 0; const segs = SPORTS.filter(s => w.hours[s] > 0);
    segs.forEach((s, j) => {
      const v = w.hours[s], y1 = y(acc + v), y0 = y(acc), gap = j > 0 ? 2 : 0;
      const hgt = Math.max(0, y0 - y1 - gap);
      if (j === segs.length - 1) el("path", { d: roundedTop(x0, y1, bw, hgt, 4), fill: SPORT_VAR[s] }, svg);
      else el("rect", { x: x0, y: y1, width: bw, height: hgt, fill: SPORT_VAR[s] }, svg);
      acc += v;
    });
    const lab = el("text", { x: cx, y: (w.total ? y(Math.max(w.total, isNow ? plannedH : 0)) : y(isNow ? plannedH : 0)) - 7, "text-anchor": "middle", fill: "var(--ink)", "font-size": 12, "font-weight": 600 }, svg);
    lab.textContent = isNow ? `${fmtH(w.total)} / ${fmtH(plannedH)}` : fmtH(w.total);
    const xl = el("text", { x: cx, y: H - 8, "text-anchor": "middle", fill: isNow ? "var(--ink)" : "var(--ink-3)", "font-size": 11 }, svg);
    xl.textContent = isNow ? "This wk" : dt(w.start).toLocaleDateString("en-NZ", { day: "numeric", month: "short" });
    const hit = el("rect", { x: cx - slot / 2, y: top, width: slot, height: H - top - bottom, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", e => tipOn(e,
      `<b>Week of ${dt(w.start).toLocaleDateString("en-NZ", { day: "numeric", month: "short" })}</b><br>` +
      SPORTS.filter(s => w.hours[s] > 0).map(s => `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${SPORT_VAR[s]};margin-right:6px"></span>${s} ${fmtH(w.hours[s])}`).join("<br>") +
      `<br>Total ${fmtH(w.total)}${isNow ? ` of ${fmtH(plannedH)} planned` : ""}${w.easy_pct != null ? `<br>${w.easy_pct}% easy` : ""}`));
    hit.addEventListener("pointerleave", tipOff);
  });
}

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });
load();
</script>
</body>
</html>
