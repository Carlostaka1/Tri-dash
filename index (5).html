<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taupō 70.3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Taupō 70.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0D1A21;        /* Lake Taupō at night */
  --surface: #13232C;
  --raised: #182C37;
  --rule: #23363F;
  --ink: #EDE9E0;       /* pumice */
  --ink-2: #AEBAC0;
  --ink-3: #82939C;
  --swim: #3987E0;
  --bike: #1FA37A;
  --run: #E0662F;
  --other: #5E707A;
  --go: #0CA30C;
  --easy: #FAB219;
  --rest: #D03B3B;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --text: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --gutter: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--text);
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter) 48px; }

/* header */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) 0 14px;
}
.race-tag { display: flex; align-items: baseline; gap: 10px; }
.race-tag b { font: 800 22px/1 var(--display); letter-spacing: .01em; }
.race-tag span { color: var(--ink-2); font-size: 14px; }
.top-right { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; }
.btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.btn:hover { background: var(--raised); }
.banner {
  margin: 0 0 14px; padding: 10px 14px; border-radius: 8px;
  background: var(--raised); color: var(--ink-2); font-size: 13px;
}
.banner code { color: var(--ink); }

/* hero */
.hero {
  position: relative; display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px;
  background: var(--surface); border-radius: 20px; padding: 28px 28px 24px 34px; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--status, var(--ink-3));
}
.verdict-word {
  font: 900 clamp(84px, 17vw, 176px)/.82 var(--display);
  text-transform: uppercase; letter-spacing: -.01em; margin: 0;
  display: flex; align-items: flex-start; gap: 14px;
}
.verdict-word svg { width: .32em; height: .32em; margin-top: .06em; color: var(--status); flex: none; }
.verdict-line { font-size: 17px; font-weight: 500; margin: 14px 0 6px; max-width: 34ch; }
.reasons { margin: 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14px; }
.reasons li::before { content: "– "; color: var(--ink-3); }
.vitals { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 22px; }
.vital { min-width: 92px; }
.vital .n { font: 800 34px/1 var(--display); }
.vital .n small { font: 500 14px var(--text); color: var(--ink-2); margin-left: 3px; }
.vital .l { font-size: 13px; color: var(--ink-3); }
.vital .d { font-size: 13px; color: var(--ink-2); }
.vital .n, .vital .l, .vital .d { display: block; }
button.vital { appearance: none; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
button.vital:hover .l { color: var(--ink); text-decoration: underline; }

/* your numbers */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile {
  appearance: none; border: 0; text-align: left; cursor: pointer; color: var(--ink); font: inherit;
  background: var(--surface); border-radius: 12px; padding: 14px 16px 13px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label label" "val spark" "sub sub";
  gap: 6px 12px; align-items: end;
}
.tile:hover { background: var(--raised); }
.t-label { grid-area: label; display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.t-label::after { content: ""; width: 7px; height: 7px; border: solid var(--ink-3); border-width: 2px 2px 0 0; transform: rotate(45deg); margin: 5px 3px 0 0; }
.t-val { grid-area: val; font: 800 34px/1 var(--display); white-space: nowrap; }
.t-val small { font: 500 13px var(--text); color: var(--ink-2); margin-left: 3px; }
.t-spark { grid-area: spark; height: 26px; }
.t-sub { grid-area: sub; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: baseline; line-height: 1.35; }
.t-sub i { flex: none; width: 7px; height: 7px; border-radius: 50%; transform: translateY(-1px); }

/* detail views */
dialog#metric {
  width: min(780px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 48px); padding: 0;
  border: 1px solid var(--rule); border-radius: 18px; background: var(--surface); color: var(--ink); overflow: auto; overscroll-behavior: contain;
}
dialog#metric::backdrop { background: rgba(4, 10, 14, .72); }
dialog#metric[open] { animation: rise .22s cubic-bezier(.2, .7, .2, 1); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.m-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px 12px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.m-head h2 { margin: 0; font: 600 16px var(--text); }
.m-close { appearance: none; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; }
.m-wrap { padding: 18px 24px 28px; }
.m-top { display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; }
.m-big { font: 900 64px/.9 var(--display); }
.m-big small { font: 500 16px var(--text); color: var(--ink-2); margin-left: 4px; }
.m-ctx { color: var(--ink-2); font-size: 15px; max-width: 46ch; }
.m-block { margin-top: 24px; }
.m-block h3, .m-text h3 { font: 600 14px var(--text); margin: 0 0 4px; }
.m-note { margin: 0 0 8px; font-size: 13px; color: var(--ink-3); max-width: 70ch; }
.m-chart { position: relative; }
.m-text { margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 18px; }
.m-text p { margin: 0 0 16px; color: var(--ink-2); max-width: 68ch; }
.lg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--ink); }
.lg i.dash { border-top-style: dashed; border-color: var(--ink-3); }
.lg i.dotline { border-top-style: dotted; border-color: var(--ink-2); }
.lg i.dot { width: 7px; height: 7px; border: 0; border-radius: 50%; background: var(--ink-3); }
.lg i.band { width: 14px; height: 10px; border: 0; background: rgba(237, 233, 224, .14); border-radius: 2px; }
.lg i.bar { width: 8px; height: 10px; border: 0; background: var(--ink-2); border-radius: 2px 2px 0 0; }
.lg i.barwarn { width: 8px; height: 10px; border: 0; background: var(--easy); border-radius: 2px 2px 0 0; }

.today h2, .section h2 { font: 600 15px/1.3 var(--text); margin: 0 0 12px; color: var(--ink); }
.today { display: flex; flex-direction: column; gap: 10px; }
.session {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px; align-items: start;
  background: var(--raised); border-radius: 10px; padding: 12px 14px 12px 0;
}
.session .bar { width: 4px; align-self: stretch; border-radius: 0 3px 3px 0; background: var(--c); }
.session .name { font-weight: 600; }
.session .meta { color: var(--ink-2); font-size: 13px; }
.session .when { font: 800 22px/1 var(--display); text-align: right; }
.session details { grid-column: 2 / 4; margin-top: 6px; }
.session summary { cursor: pointer; color: var(--ink-3); font-size: 13px; }
.session pre {
  margin: 6px 0 0; white-space: pre-wrap; font: 400 13px/1.55 var(--text); color: var(--ink-2);
}
.session.is-done .name::after { content: "Done"; margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--go); }
.next { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.next b { color: var(--ink); font-weight: 600; }
.empty { color: var(--ink-2); font-size: 14px; padding: 12px 0; }

/* sections */
.section { margin-top: 36px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { margin: 0; }
.section-head span { color: var(--ink-3); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--rule); }
.day { padding: 10px 8px 14px 0; min-height: 112px; border-right: 1px solid var(--rule); }
.day + .day { padding-left: 10px; }
.day:last-child { border-right: 0; }
.day-name { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
.day-name b { font: 800 20px/1 var(--display); color: var(--ink-2); margin-right: 4px; }
.day.is-today .day-name, .day.is-today .day-name b { color: var(--ink); }
.day.is-today { box-shadow: inset 0 3px 0 var(--ink); }
.chip { display: flex; gap: 7px; align-items: flex-start; font-size: 13px; line-height: 1.3; margin-bottom: 8px; }
.chip i { flex: none; display: grid; place-items: center; width: 15px; height: 15px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--c); }
.chip i svg { width: 9px; height: 9px; color: var(--bg); }
.chip.done i { background: var(--c); }
.chip.done small { color: var(--go); }
.chip.missed { color: var(--ink-3); }
.chip.missed i { opacity: .45; border-style: dashed; }
.chip.missed small { color: var(--rest); }
.chip small { display: block; color: var(--ink-3); }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--ink-3); font-size: 12px; }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { display: grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink-2); }
.key i svg { width: 8px; height: 8px; color: var(--bg); }
.key i.f { background: var(--ink-2); }
.key i.m { border-style: dashed; opacity: .6; }

/* recovery sparklines */
.spark-row { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.spark-row:last-of-type { border-bottom: 1px solid var(--rule); }
.spark-label .n { font: 800 26px/1 var(--display); }
.spark-label .n small { font: 500 13px var(--text); color: var(--ink-2); margin-left: 2px; }
.spark-label .l { font-size: 13px; color: var(--ink-3); }
.spark { height: 64px; position: relative; }
.spark svg, .chart svg { display: block; overflow: visible; }

/* load */
.chart { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend i.ghost { background: none; border: 1.5px dashed var(--ink-3); }
.split { margin-top: 18px; }
.split-row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.split-row b { font-weight: 600; color: var(--ink); text-align: right; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--rule); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--ink-2); }
.track .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); left: 80%; }
.split-note { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.fff { display: flex; gap: 28px; margin-top: 20px; flex-wrap: wrap; }
.fff .n { font: 800 28px/1 var(--display); }
.fff .l { font-size: 13px; color: var(--ink-3); }
.warns { list-style: none; padding: 0; margin: 18px 0 0; }
.warns li { display: flex; gap: 8px; font-size: 14px; color: var(--ink-2); margin-top: 8px; }
.warns svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--easy); }

/* recent sessions */
.rs-list { border-top: 1px solid var(--rule); }
.rs {
  display: grid; grid-template-columns: 76px minmax(0, 1.4fr) 150px minmax(0, 1.3fr); gap: 4px 20px;
  align-items: center; padding: 12px 0 12px 14px; border-bottom: 1px solid var(--rule);
  box-shadow: inset 4px 0 0 var(--c);
}
.rs-when b { display: block; font: 800 20px/1 var(--display); }
.rs-when span { font-size: 12px; color: var(--ink-3); }
.rs-name { font-weight: 600; color: var(--ink); text-decoration: none; }
.rs-name:hover { text-decoration: underline; }
.rs-plan { font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.rs-stats { font-size: 13px; color: var(--ink-2); }
.rs-split { font-size: 12px; color: var(--ink-3); }
.rs-split .track { height: 6px; margin-bottom: 4px; }
.rs-check { display: flex; gap: 8px; font-size: 14px; color: var(--ink-2); line-height: 1.35; }
.rs-check svg { flex: none; width: 16px; height: 16px; margin-top: 1px; }
.rs-check.good svg { color: var(--go); }
.rs-check.warn svg { color: var(--easy); }
.rs-check.bad svg { color: var(--rest); }
.rs-check.info svg { color: var(--ink-3); }
.rs-check.bad, .rs-check.warn { color: var(--ink); }
.stale { font-size: 12px; color: var(--easy); }

/* race strip */
.race-days { font: 900 clamp(56px, 11vw, 112px)/.85 var(--display); }
.race-days small { font: 500 15px var(--text); color: var(--ink-2); margin-left: 8px; }
.strip { display: flex; gap: 3px; margin-top: 18px; }
.leg { min-width: 0; }
.leg .t { height: 14px; background: var(--rule); position: relative; overflow: hidden; }
.leg:first-child .t { border-radius: 7px 0 0 7px; }
.leg:last-child .t { border-radius: 0 7px 7px 0; }
.leg .t span { position: absolute; inset: 0 auto 0 0; background: var(--c); width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
.leg .lab { padding-top: 8px; font-size: 13px; color: var(--ink-2); padding-right: 6px; }
.leg .lab b { display: block; color: var(--ink); font-weight: 600; }
.leg-labels { display: none; }
.race-note { color: var(--ink-3); font-size: 13px; margin-top: 12px; max-width: 70ch; }

/* tables + tooltip */
details.table { margin-top: 10px; font-size: 13px; color: var(--ink-3); }
details.table summary { cursor: pointer; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; color: var(--ink-2); }
th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--rule); font-weight: 400; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-3); }
.tip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--raised); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; font-size: 13px; line-height: 1.4;
  box-shadow: 0 6px 20px rgba(0,0,0,.35); opacity: 0; transition: opacity .08s; white-space: nowrap;
}
.tip.on { opacity: 1; }

/* access gate + states */
.gate { max-width: 360px; margin: 18vh auto 0; }
.gate h1 { font: 900 56px/.9 var(--display); margin: 0 0 12px; text-transform: uppercase; }
.gate p { color: var(--ink-2); }
.gate form { display: flex; gap: 8px; margin-top: 16px; }
.gate input { flex: 1; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font-size: 16px; /* under 16px makes iPhone zoom in and stay zoomed */ }
.gate .err { color: #F08A8A; font-size: 14px; min-height: 1.5em; }
.state { padding: 60px 0; color: var(--ink-2); }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; padding: 22px 20px 20px 26px; gap: 22px; }
  .grid-2 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 > * + * { margin-top: 36px; }
  .week { grid-template-columns: 1fr; }
  .day { display: grid; grid-template-columns: 70px 1fr; min-height: 0; border-right: 0; border-bottom: 1px solid var(--rule); padding: 10px 0 4px; }
  .day + .day { padding-left: 0; }
  .day.is-today { box-shadow: inset 3px 0 0 var(--ink); padding-left: 10px; }
  .top-right .upd { display: none; }
  .rs { grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; }
  .rs-when b { font-size: 18px; white-space: nowrap; }
  .rs-split, .rs-check { grid-column: 2; }
  .rs-split { display: flex; align-items: center; gap: 10px; }
  .rs-split .track { flex: 0 0 120px; margin: 0; }
  .leg .lab { display: none; }
  .leg-labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 10px; font-size: 13px; color: var(--ink-2); }
  .leg-labels b { display: block; color: var(--ink); font-weight: 600; }
}
@media (max-width: 600px) {
  dialog#metric { width: 100vw; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; border-width: 1px 0 0; }
  .m-head { padding: 14px 16px 10px; }
  .m-wrap { padding: 16px 16px 28px; }
  .m-big { font-size: 52px; }
  .tile { padding: 12px 12px 11px; gap: 5px 8px; }
  .t-val { font-size: 28px; }
  .t-spark svg { width: 46px; }
}
@media (prefers-reduced-motion: reduce) {
  dialog#metric[open] { animation: none; }
  .leg .t span, .tip { transition: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Loading your numbers…</div></div>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="metric" aria-labelledby="mTitle">
  <div class="m-head"><h2 id="mTitle"></h2><button class="m-close" type="button" aria-label="Close">&times;</button></div>
  <div class="m-wrap"></div>
  <div class="tip" role="tooltip"></div>
</dialog>

<script>
// ---------------------------------------------------------------------------
// CONFIG: paste your Cloud Function URL here after you deploy it.
// Leave it empty to see the demo data.
const API_URL = "https://australia-southeast1-arena-scout-492406.cloudfunctions.net/tri-dashboard";
// ---------------------------------------------------------------------------

const DEMO = /*DEMO_JSON*/null;

const SPORT_VAR = { Swim: "var(--swim)", Bike: "var(--bike)", Run: "var(--run)", Other: "var(--other)" };
const SPORTS = ["Swim", "Bike", "Run", "Other"];
const STATUS_VAR = { go: "var(--go)", easy: "var(--easy)", rest: "var(--rest)", unknown: "var(--ink-3)" };
const ICONS = {
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>',
  easy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M7 12h10"/></svg>',
  rest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M10 8v8M14 8v8"/></svg>',
  unknown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
};

const TICK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.3 2.3L9.6 3.6"/></svg>';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dt = iso => new Date(iso + "T00:00:00");
const dayShort = iso => dt(iso).toLocaleDateString("en-NZ", { weekday: "short" });
const dayLong = iso => dt(iso).toLocaleDateString("en-NZ", { weekday: "long", day: "numeric", month: "short" });
const fmtMin = m => !m ? "" : m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
const fmtH = h => `${(h || 0).toFixed(1)}h`;
const toIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (iso, n) => { const d = dt(iso); d.setDate(d.getDate() + n); return toIso(d); };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let DATA = null;

// ---------------------------------------------------------------- loading
let lastLoad = 0, loading = false;
async function load(silent = false) {
  const demo = !API_URL || new URLSearchParams(location.search).has("demo");
  if (demo) {
    if (!DEMO) { $("#app").innerHTML = '<div class="state">Paste your Cloud Function URL into <code>API_URL</code> at the top of the script, then reload.</div>'; return; }
    DATA = DEMO; render(true); return;
  }
  const token = store.get("dashToken");
  if (!token) { gate(); return; }
  if (loading) return;
  loading = true;
  if (!silent || !DATA) $("#app").innerHTML = '<div class="state">Loading your numbers…</div>';
  try {
    const r = await fetch(API_URL, { headers: { "X-Dash-Token": token }, cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { store.del("dashToken"); gate("That code didn't work. Check DASH_TOKEN on the function."); return; }
    if (!r.ok) throw new Error(body.error || `Error ${r.status}`);
    DATA = body; lastLoad = Date.now(); render(false);
  } catch (e) {
    if (silent && DATA) { const u = $(".upd"); if (u) u.innerHTML = '<span class="stale">Couldn\'t refresh, showing older data</span>'; }
    else $("#app").innerHTML = `<div class="state">Couldn't load your data: ${esc(e.message)}<br><br><button class="btn" onclick="load()">Try again</button></div>`;
  } finally { loading = false; }
}

// refresh on its own: every 15 min while open, and when you come back to the tab or app
setInterval(() => { if (document.visibilityState === "visible" && lastLoad && !$("#metric").open) load(true); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && lastLoad && Date.now() - lastLoad > 5 * 60 * 1000) load(true);
});

function gate(msg = "") {
  $("#app").innerHTML = `
    <div class="gate">
      <h1>Taupō 70.3</h1>
      <p>Enter the access code you set as DASH_TOKEN on your function. It's saved on this device.</p>
      <form id="gate"><label class="sr" for="code" hidden>Access code</label>
        <input id="code" type="password" autocomplete="current-password" placeholder="Access code" aria-label="Access code" required>
        <button class="btn" type="submit">Unlock</button>
      </form>
      <div class="err" role="alert">${esc(msg)}</div>
    </div>`;
  $("#gate").addEventListener("submit", e => {
    e.preventDefault(); store.set("dashToken", $("#code").value.trim()); load();
  });
  $("#code").focus();
}

function hero(d) {
  const v = d.verdict, r = d.recovery;
  const todayPlan = matchDay(d, d.today);
  const tomorrow = d.plan.filter(p => p.date === addDays(d.today, 1));
  const delta = (m, unit, invert) => {
    if (m.value == null || m.baseline == null) return "";
    const diff = m.value - m.baseline;
    const txt = unit === "h" ? `${diff >= 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)}h` : `${diff >= 0 ? "+" : "−"}${Math.abs(Math.round(diff))}`;
    return `${txt} vs ${unit === "h" ? m.baseline.toFixed(1) + "h" : Math.round(m.baseline)} baseline`;
  };
  const vital = (val, unit, label, m) => `
    <${d.trends ? 'button type="button" data-open="recovery"' : "div"} class="vital"><span class="n">${val ?? "–"}${val != null ? `<small>${unit}</small>` : ""}</span>
    <span class="l">${label}${m.date && m.date !== d.today ? `, from ${dayShort(m.date)}` : ""}</span><span class="d">${delta(m, unit === "h" ? "h" : "")}</span></${d.trends ? "button" : "div"}>`;
  return `
  <section class="hero" style="--status:${STATUS_VAR[v.level]}" aria-label="Today">
    <div>
      <p class="verdict-word">${ICONS[v.level]}<span>${esc(v.word)}</span></p>
      <p class="verdict-line">${esc(v.line)}</p>
      ${v.reasons.length ? `<ul class="reasons">${v.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="vitals">
        ${vital(r.hrv.value, "ms", "HRV", r.hrv)}
        ${vital(r.rhr.value, "bpm", "Resting HR", r.rhr)}
        ${vital(r.sleep.value != null ? r.sleep.value.toFixed(1) : null, "h", r.sleep.score ? `Sleep, score ${r.sleep.score}` : "Sleep", r.sleep)}
      </div>
    </div>
    <div class="today">
      <h2>${esc(dayLong(d.today))}</h2>
      ${todayPlan.length ? todayPlan.map(sessionCard).join("") : '<div class="empty">Nothing planned. Rest day.</div>'}
      ${tomorrow.length ? `<div class="next">Tomorrow: ${tomorrow.map(t => `<b>${esc(t.name)}</b> ${fmtMin(t.minutes)}`).join(", ")}</div>` : ""}
    </div>
  </section>`;
}

function sessionCard(s) {
  const meta = [s.sport === "Bike" ? "Bike" : s.sport, s.km ? `${s.km} km` : "", s.state === "done" && s.doneMin ? `did ${fmtMin(s.doneMin)}` : ""].filter(Boolean).join(", ");
  return `<div class="session ${s.state === "done" ? "is-done" : ""}" style="--c:${SPORT_VAR[s.sport]}">
    <span class="bar"></span>
    <div><div class="name">${esc(s.name)}</div><div class="meta">${esc(meta)}</div></div>
    <div class="when">${fmtMin(s.minutes)}</div>
    ${s.steps ? `<details><summary>Steps</summary><pre>${esc(s.steps)}</pre></details>` : ""}
  </div>`;
}

// planned vs done for one day: match by sport, in order
function matchDay(d, iso) {
  const planned = d.plan.filter(p => p.date === iso).map(p => ({ ...p }));
  const done = d.done.filter(a => a.date === iso).map(a => ({ ...a, used: false }));
  for (const p of planned) {
    const a = done.find(x => !x.used && x.sport === p.sport);
    if (a) { a.used = true; p.state = "done"; p.doneMin = a.minutes; }
    else p.state = iso < d.today ? "missed" : "planned";
  }
  const extra = done.filter(a => !a.used).map(a => ({ ...a, state: "done", extra: true, doneMin: a.minutes }));
  return [...planned, ...extra];
}

function weekDays(d) {
  const t = dt(d.today); const dow = (t.getDay() + 6) % 7;
  return Array.from({ length: 7 }, (_, i) => addDays(d.today, i - dow));
}

function weekTotals(d) {
  const days = weekDays(d);
  const plannedMin = d.plan.filter(p => days.includes(p.date)).reduce((s, p) => s + (p.minutes || 0), 0);
  const doneMin = d.done.filter(a => days.includes(a.date)).reduce((s, a) => s + (a.minutes || 0), 0);
  return `${fmtH(doneMin / 60)} done of ${fmtH(plannedMin / 60)} planned`;
}

function week(d) {
  const cells = weekDays(d).map(iso => {
    const items = matchDay(d, iso);
    const chips = items.map(s => `
      <div class="chip ${s.state}" style="--c:${SPORT_VAR[s.sport]}"><i aria-hidden="true">${s.state === "done" ? TICK : ""}</i>
        <div>${esc(s.name)}<small>${s.state === "missed" ? "Missed" : s.state === "done" ? `Done, ${fmtMin(s.doneMin)}` : fmtMin(s.minutes)}${s.extra ? ", unplanned" : ""}</small></div></div>`).join("");
    const t = dt(iso);
    return `<div class="day ${iso === d.today ? "is-today" : ""}">
      <div class="day-name"><b>${t.getDate()}</b>${dayShort(iso)}</div>
      <div>${chips || '<div class="chip" style="color:var(--ink-3)">Rest</div>'}</div></div>`;
  }).join("");
  return `<div class="week">${cells}</div>
    <div class="key"><span><i></i>Planned</span><span><i class="f">${TICK}</i>Done</span><span><i class="m"></i>Missed</span>
    ${SPORTS.slice(0, 3).map(s => `<span><i style="border-color:${SPORT_VAR[s]};background:${SPORT_VAR[s]}"></i>${s}</span>`).join("")}</div>`;
}

};
const clock = t => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")}${ap}`; };

// ---------------------------------------------------------------- charts (plain SVG)
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const tipEl = () => document.querySelector("dialog[open] .tip") || $("#tip");
function tipOn(e, html) { const t = tipEl(); t.innerHTML = html; t.classList.add("on"); tipMove(e); }
function tipMove(e) {
  const t = tipEl(), pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + pad, y = e.clientY - h - pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y < 8) y = e.clientY + pad;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function tipOff() { document.querySelectorAll(".tip").forEach(t => t.classList.remove("on")); }

function drawCharts() {
  if (!DATA) return;
  drawLoad();
  if (DATA.trends) drawTileSparks(DATA);
}

function roundedTop(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function drawLoad(box = $("#loadChart"), weeks = DATA.load.weeks.slice(-6), H = 220) {
  if (!box) return;
  box.innerHTML = "";
  const W = box.clientWidth, top = 22, bottom = 26, left = 30;
  const days = weekDays(DATA);
  const plannedH = DATA.plan.filter(p => days.includes(p.date)).reduce((s, p) => s + (p.minutes || 0), 0) / 60;
  const maxV = Math.max(4, ...weeks.map(w => w.total), plannedH);
  const step = maxV > 10 ? 4 : 2, yMax = Math.ceil(maxV / step) * step;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" }, box);
  const y = v => top + (H - top - bottom) * (1 - v / yMax);
  for (let v = 0; v <= yMax; v += step) {
    el("line", { x1: left, x2: W, y1: y(v), y2: y(v), stroke: "var(--rule)", "stroke-width": 1 }, svg);
    const t = el("text", { x: left - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--ink-3)", "font-size": 11 }, svg); t.textContent = v + "h";
  }
  const slot = (W - left) / weeks.length, bw = Math.min(44, slot * 0.56);
  weeks.forEach((w, i) => {
    const cx = left + slot * i + slot / 2, x0 = cx - bw / 2, isNow = i === weeks.length - 1;
    if (isNow && plannedH > 0) {
      el("rect", { x: x0 + .75, y: y(plannedH), width: bw - 1.5, height: y(0) - y(plannedH), rx: 4, fill: "none", stroke: "var(--ink-3)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, svg);
    }
    let acc = 0; const segs = SPORTS.filter(s => w.hours[s] > 0);
    segs.forEach((s, j) => {
      const v = w.hours[s], y1 = y(acc + v), y0 = y(acc), gap = j > 0 ? 2 : 0;
      const hgt = Math.max(0, y0 - y1 - gap);
      if (j === segs.length - 1) el("path", { d: roundedTop(x0, y1, bw, hgt, 4), fill: SPORT_VAR[s] }, svg);
      else el("rect", { x: x0, y: y1, width: bw, height: hgt, fill: SPORT_VAR[s] }, svg);
      acc += v;
    });
    const tight = slot < 48, skip = tight && (weeks.length - 1 - i) % 2 === 1;
    if (!tight || isNow || w.total) {
      const lab = el("text", { x: cx, y: (w.total ? y(Math.max(w.total, isNow ? plannedH : 0)) : y(isNow ? plannedH : 0)) - 7, "text-anchor": "middle", fill: "var(--ink)", "font-size": tight ? 10 : 12, "font-weight": 600 }, svg);
      lab.textContent = isNow && !tight ? `${fmtH(w.total)} / ${fmtH(plannedH)}` : tight ? Math.round(w.total) || "" : fmtH(w.total);
    }
    if (!skip) {
    const xl = el("text", { x: cx, y: H - 8, "text-anchor": "middle", fill: isNow ? "var(--ink)" : "var(--ink-3)", "font-size": 11 }, svg);
    xl.textContent = isNow ? (tight ? "Now" : "This wk") : dt(w.start).toLocaleDateString("en-NZ", { day: "numeric", month: "short" });
    }
    const hit = el("rect", { x: cx - slot / 2, y: top, width: slot, height: H - top - bottom, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", e => tipOn(e,
      `<b>Week of ${dt(w.start).toLocaleDateString("en-NZ", { day: "numeric", month: "short" })}</b><br>` +
      SPORTS.filter(s => w.hours[s] > 0).map(s => `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${SPORT_VAR[s]};margin-right:6px"></span>${s} ${fmtH(w.hours[s])}`).join("<br>") +
      `<br>Total ${fmtH(w.total)}${isNow ? ` of ${fmtH(plannedH)} planned` : ""}${w.easy_pct != null ? `<br>${w.easy_pct}% easy` : ""}`));
    hit.addEventListener("pointerleave", tipOff);
  });
}

// ---------------------------------------------------------------- your numbers: tiles + detail views
const lastOf = a => { for (let i = (a || []).length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
const meanOf = a => { const v = (a || []).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sgn = (v, dp = 0) => v == null ? "–" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(dp)}`;
const mmss = s => s == null ? "–" : `${Math.floor(Math.round(s) / 60)}:${String(Math.round(s) % 60).padStart(2, "0")}`;
const dayMon = iso => dt(iso).toLocaleDateString("en-NZ", { day: "numeric", month: "short" });
const STATUS_CLR = { good: "var(--go)", warn: "var(--easy)", bad: "var(--rest)", info: "var(--ink-3)" };
let lastView = null;

function formZone(f) {
  if (f == null) return { label: "No data yet", level: "info" };
  if (f > 25) return { label: "Very fresh, fitness slipping", level: "warn" };
  if (f > 5) return { label: "Fresh", level: "good" };
  if (f >= -10) return { label: "Grey zone", level: "info" };
  if (f >= -30) return { label: "Building fitness", level: "good" };
  return { label: "High strain", level: "bad" };
}

// put runs or rides onto the daily axis, averaging two on the same day
function onAxis(dates, pts) {
  const idx = Object.fromEntries(dates.map((d, i) => [d, i])), out = dates.map(() => null), n = dates.map(() => 0);
  pts.forEach(p => { const i = idx[p.date]; if (i == null) return; out[i] = ((out[i] || 0) * n[i] + p.value) / (n[i] + 1); n[i]++; });
  return out;
}
function engine(pts) {
  if (!pts || !pts.length) return null;
  const roll = pts.map((p, i) => { const w = pts.slice(Math.max(0, i - 4), i + 1); return { ...p, value: w.reduce((s, q) => s + q.value, 0) / w.length }; });
  const cutoff = addDays(DATA.today, -28), then = [...roll].reverse().find(p => p.date <= cutoff);
  return { roll, now: roll[roll.length - 1].value, then: then ? then.value : null, n: pts.length };
}

function metrics(d) {
  const T = d.trends, W = d.load.weeks;
  const ctl = lastOf(T.ctl), ctlWk = T.ctl[T.ctl.length - 8], form = lastOf(T.form), fz = formZone(form);
  const hrv7 = lastOf(T.hrv7), band = T.hrv_band;
  const hs = hrv7 == null || !band ? null : hrv7 < band[0] ? "below" : hrv7 > band[1] ? "above" : "in";
  const run = engine(T.run_eff), bike = engine(T.bike_eff);
  const runDiff = run && run.then != null ? Math.round(run.now - run.then) : null;
  const thisWk = W[W.length - 1], lastWk = W[W.length - 2];
  return [
    { key: "recovery", label: "Recovery", value: hrv7 == null ? "–" : Math.round(hrv7), unit: "ms",
      sub: hs ? `7-day HRV, ${hs === "in" ? "in your normal range" : hs + " your normal"}` : "7-day HRV, still learning your normal",
      level: hs === "below" ? "warn" : hs ? "good" : null, spark: T.hrv7.slice(-30) },
    { key: "fitness", label: "Fitness", value: ctl == null ? "–" : Math.round(ctl), unit: "",
      sub: ctl != null && ctlWk != null ? `${sgn(ctl - ctlWk, 1)} in the last 7 days` : "6-week training load", spark: T.ctl.slice(-42) },
    { key: "form", label: "Form", value: sgn(form), unit: "", sub: fz.label, level: fz.level, spark: T.form.slice(-42) },
    { key: "run", label: "Run engine", value: run ? mmss(run.now) : "–", unit: run ? "/km" : "",
      sub: !run ? "Needs runs with heart rate" : runDiff == null ? "Easy pace at 145 bpm" : `At 145 bpm, ${Math.abs(runDiff)}s ${runDiff <= 0 ? "faster" : "slower"} than 4 wks ago`,
      spark: run ? run.roll.map(p => -p.value) : [] },
    { key: "bike", label: "Bike engine", value: bike ? Math.round(bike.now) : "–", unit: bike ? "W" : "",
      sub: bike ? `Power at 135 bpm, ${bike.n} ride${bike.n === 1 ? "" : "s"} so far` : "Needs rides with heart rate",
      spark: bike ? bike.roll.map(p => p.value) : [] },
    { key: "volume", label: "Training volume", value: fmtH(thisWk.total), unit: "",
      sub: `This week so far, last week ${fmtH(lastWk.total)}`, spark: W.map(w => w.total) },
  ];
}

function tilesBlock(d) {

      <span class="t-sub">${m.level ? `<i style="background:${STATUS_CLR[m.level]}"></i>` : ""}<span>${esc(m.sub)}</span></span>
    </button>`).join("")}</div>`;
}

function drawTileSparks(d) {
  metrics(d).forEach(m => {
    const host = document.querySelector(`[data-spark="${m.key}"]`); if (!host) return;
    const v = m.spark.filter(x => x != null); host.innerHTML = "";
    if (v.length < 2) return;
    const W = 72, H = 26, lo = Math.min(...v), rng = (Math.max(...v) - lo) || 1;
    const pts = v.map((val, i) => `${(2 + i / (v.length - 1) * (W - 4)).toFixed(1)},${(H - 3 - (val - lo) / rng * (H - 6)).toFixed(1)}`).join(" ");
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  });
}

const legendHtml = items => `<div class="lg">${items.map(([label, kind]) => `<span><i class="${kind}"></i>${esc(label)}</span>`).join("")}</div>`;
const sportLegend = () => `<div class="lg">${SPORTS.map(s => `<span><i class="bar" style="background:${SPORT_VAR[s]}"></i>${s}</span>`).join("")}<span><i class="band" style="background:none;outline:1.5px dashed var(--ink-3)"></i>Planned this week</span></div>`;
function tableHtml(dates, cols, label = "Day") {
  const rows = dates.map((dd, i) => [dd, i]).reverse();
  return `<table><tr><th>${label}</th>${cols.map(c => `<th>${esc(c[0])}</th>`).join("")}</tr>${rows.map(([dd, i]) =>
    `<tr><td>${dayShort(dd)} ${dayMon(dd)}</td>${cols.map(c => `<td>${c[1][i] == null ? "–" : c[2](c[1][i])}</td>`).join("")}</tr>`).join("")}</table>`;
}

function niceStep(range) {
  const raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
}

// one chart for every detail view: lines, dots or bars on a date axis, with bands, zones, reference lines and hover
function lineChart(box, c) {
  if (!box) return;
  box.innerHTML = "";
  const n = c.dates.length, W = box.clientWidth, H = box.clientHeight || 220, L = 46, R = 10, T = 12, B = 24;
  const vals = [];
  c.series.forEach(s => s.values.forEach(v => { if (v != null) vals.push(v); }));
  if (!vals.length) { box.innerHTML = `<div class="empty">${esc(c.empty || "No data yet. This fills in as your watch syncs.")}</div>`; return; }
  (c.refs || []).forEach(r => vals.push(r.value));
  if (c.band) vals.push(...c.band);
  if (c.yRange) vals.push(...c.yRange);
  let lo = c.zeroBase ? 0 : Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1;
  if (!c.zeroBase) lo -= pad; hi += pad;
  const step = niceStep(hi - lo);
  lo = c.zeroBase ? 0 : Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (c.yMax != null) hi = c.yMax;
  const pw = W - L - R, ph = H - T - B, bars = c.series.some(s => s.kind === "bars"), slot = pw / n;
  const x = i => bars ? L + slot * (i + 0.5) : L + (n === 1 ? pw / 2 : pw * i / (n - 1));
  const y = v => { const t = (v - lo) / (hi - lo); return T + ph * (c.invert ? t : 1 - t); };
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" }, box);
  (c.zones || []).forEach(z => {
    const a = Math.max(lo, z.from), b = Math.min(hi, z.to); if (b <= a) return;
    const top = Math.min(y(a), y(b)), h = Math.abs(y(a) - y(b));
    el("rect", { x: L, y: top, width: pw, height: h, fill: z.color, "fill-opacity": 0.1 }, svg);
    if (h > 16) { const t = el("text", { x: L + pw - 6, y: top + h - 5, "text-anchor": "end", fill: "var(--ink-3)", "font-size": 11 }, svg); t.textContent = z.label; }
  });
  for (let v = lo; v <= hi + step / 1e6; v += step) {
    el("line", { x1: L, x2: L + pw, y1: y(v), y2: y(v), stroke: "var(--rule)", "stroke-width": 1 }, svg);
    const t = el("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--ink-3)", "font-size": 11 }, svg); t.textContent = c.fmt(v);
  }
  const ticks = n <= 7 ? [...Array(n).keys()] : [0, 1, 2, 3, 4].map(k => Math.round(k * (n - 1) / 4));
  ticks.forEach(i => {
    const anchor = bars ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    const t = el("text", { x: x(i), y: H - 6, "text-anchor": anchor, fill: "var(--ink-3)", "font-size": 11 }, svg); t.textContent = dayMon(c.dates[i]);
  });
  if (c.band) { const a = y(c.band[0]), b = y(c.band[1]); el("rect", { x: L, y: Math.min(a, b), width: pw, height: Math.abs(a - b), fill: "var(--ink)", "fill-opacity": 0.08 }, svg); }
  (c.refs || []).forEach(r => el("line", { x1: L, x2: L + pw, y1: y(r.value), y2: y(r.value), stroke: r.color || "var(--ink-2)", "stroke-width": r.width || 1, "stroke-dasharray": r.dash || "4 4" }, svg));
  c.series.forEach(s => {
    if (s.kind === "bars") {
      const bw = Math.max(2, Math.min(18, slot * 0.6));
      s.values.forEach((v, i) => { if (v == null) return; const top = y(v); el("path", { d: roundedTop(x(i) - bw / 2, top, bw, Math.max(0, y(lo) - top), 3), fill: s.warnBelow != null && v < s.warnBelow ? "var(--easy)" : s.color }, svg); });
    } else if (s.kind === "dots") {
      s.values.forEach((v, i) => { if (v != null) el("circle", { cx: x(i), cy: y(v), r: 3, fill: s.color }, svg); });
    } else {
      let dp = "", pen = false;
      s.values.forEach((v, i) => { if (v == null) { if (!s.connect) pen = false; return; } dp += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
      el("path", { d: dp, fill: "none", stroke: s.color, "stroke-width": s.width || 2, "stroke-dasharray": s.dash || "none", "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    }
  });
  const cross = el("line", { y1: T, y2: T + ph, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" }, svg);
  const marks = c.series.map(s => s.kind === "bars" ? null : el("circle", { r: 4.5, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg));
  const hit = el("rect", { x: L, y: 0, width: pw, height: H, fill: "transparent" }, svg);
  const has = i => c.series.some(s => s.values[i] != null);
  hit.addEventListener("pointermove", e => {
    const px = e.clientX - svg.getBoundingClientRect().left;
    let i = Math.max(0, Math.min(n - 1, bars ? Math.floor((px - L) / slot) : Math.round((px - L) / pw * (n - 1))));
    if (!has(i)) { let best = -1; for (let k = 0; k < n; k++) if (has(k) && (best < 0 || Math.abs(k - i) < Math.abs(best - i))) best = k; if (best < 0) return; i = best; }
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    marks.forEach((m, k) => { if (!m) return; const v = c.series[k].values[i]; if (v == null) m.setAttribute("visibility", "hidden"); else { m.setAttribute("cx", x(i)); m.setAttribute("cy", y(v)); m.setAttribute("visibility", "visible"); } });
    const rows = c.series.map(s => s.values[i] == null ? "" : `<br>${esc(s.label)} ${c.fmt(s.values[i])}${c.unit || ""}`).join("");
    tipOn(e, `<b>${c.dateLabel ? c.dateLabel(c.dates[i]) : `${dayShort(c.dates[i])} ${dayMon(c.dates[i])}`}</b>${rows}${c.extra ? c.extra(i) : ""}`);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); marks.forEach(m => m && m.setAttribute("visibility", "hidden")); tipOff(); });
}

const VIEWS = {
  recovery(d) {
    const T = d.trends, v = d.verdict, band = T.hrv_band, base = T.rhr_base;
    const hrv7 = lastOf(T.hrv7), rhrNow = lastOf(T.rhr), slAvg = meanOf(T.sleep.slice(-7));
    const short14 = T.sleep.slice(-14).filter(x => x != null && x < 6.5).length;
    const lines = [];
    if (band && hrv7 != null) lines.push(hrv7 < band[0]
      ? `Your 7-day HRV (${Math.round(hrv7)}) has slipped below your normal range of ${band[0]}–${band[1]}. That usually means fatigue is stacking up, or stress or sleep is off. Keep the next few days easy until it's back in range.`
      : `Your 7-day HRV (${Math.round(hrv7)}) is inside your normal range of ${band[0]}–${band[1]}, so you're absorbing the training.`);
    else lines.push("Your HRV range needs a couple more weeks of nights before it means much.");
    if (base && rhrNow) lines.push(rhrNow - base >= 5
      ? `Resting HR is ${rhrNow}, ${rhrNow - base} above your baseline of ${base}. If it's still up tomorrow, swap any hard session for easy.`
      : `Resting HR ${rhrNow} against a baseline of ${base}, which is normal.`);
    if (slAvg != null) lines.push(`You've averaged ${slAvg.toFixed(1)}h over the last 7 nights${short14 ? `, with ${short14} night${short14 > 1 ? "s" : ""} under 6.5h in the last two weeks` : ""}. ${slAvg < 7.5 ? "That's the easiest thing to fix: before a 5am start, lights out by 9." : "Keep it there."}`);
    const D60 = T.dates.slice(-60), D30 = T.dates.slice(-30);
    return {
      title: "Recovery",
      big: `<span style="color:${STATUS_CLR[{ go: "good", easy: "warn", rest: "bad" }[v.level] || "info"]}">${esc(v.word.toUpperCase())}</span>`,
      ctx: esc(v.line),
      blocks: [
        { title: "HRV", note: "Last 60 nights. The shaded band is your normal range.", legend: [["7-day average", ""], ["Nightly", "dot"], ["Normal range", "band"]],
          draw: box => lineChart(box, { dates: D60, band, unit: " ms", fmt: x => Math.round(x), series: [
            { label: "7-day avg", values: T.hrv7.slice(-60), color: "var(--ink)", connect: true },
            { label: "Night", values: T.hrv.slice(-60), color: "var(--ink-3)", kind: "dots" }] }) },
        { title: "Resting heart rate", note: "Dashed is your baseline. Above the dotted line means something's up.", legend: [["Resting HR", ""], ["Baseline", "dash"], ["Baseline + 5", "dotline"]],
          draw: box => lineChart(box, { dates: D60, unit: " bpm", fmt: x => Math.round(x), series: [{ label: "Resting HR", values: T.rhr.slice(-60), color: "var(--ink)" }],
            refs: base ? [{ value: base, dash: "5 4", color: "var(--ink-3)" }, { value: base + 5, dash: "1 4" }] : [] }) },
        { title: "Sleep", note: "Last 30 nights. The line is 8 hours.", legend: [["Hours", "bar"], ["Under 6.5h", "barwarn"]], height: 190,
          draw: box => lineChart(box, { dates: D30, zeroBase: true, unit: "h", fmt: x => x.toFixed(x % 1 ? 1 : 0), refs: [{ value: 8, dash: "5 4" }],
            series: [{ label: "Sleep", values: T.sleep.slice(-30), color: "var(--ink-2)", kind: "bars", warnBelow: 6.5 }],
            extra: i => { const sc = T.sleep_score.slice(-30)[i]; return sc ? `<br>Score ${sc}` : ""; } }) },
      ],
      meaning: "Three signals for how well you're soaking up training. HRV is how much your heartbeat varies overnight: above your own normal means recovered, a few days below means fatigue, stress or getting sick. Resting HR drifts up when you're run down. Sleep is when training actually turns into fitness. Only ever compare these against yourself.",
      forYou: lines.join(" "),
      table: tableHtml(D30, [["HRV", T.hrv.slice(-30), x => Math.round(x)], ["7-day", T.hrv7.slice(-30), x => Math.round(x)], ["Resting HR", T.rhr.slice(-30), x => x], ["Sleep", T.sleep.slice(-30), x => x.toFixed(1) + "h"], ["Score", T.sleep_score.slice(-30), x => x]]),
    };
  },

  fitness(d) {
    const T = d.trends, ctl = lastOf(T.ctl), atl = lastOf(T.atl), ramp = d.load.ramp;
    const weeksLeft = Math.max(1, Math.round((dt(addDays(d.race.date, -14)) - dt(d.today)) / (7 * 864e5)));
    const need = ctl == null ? null : 60 - ctl;
    let fy = ctl == null ? "Fitness fills in once intervals.icu has a few weeks of your sessions."
      : need > 0 ? `You're at ${Math.round(ctl)}. First-timers usually start a 70.3 somewhere around 55–70. Getting to about 60 by your taper in ${weeksLeft} weeks takes roughly ${(need / weeksLeft).toFixed(1)} a week, which is a sustainable build.`
      : `You're at ${Math.round(ctl)}, already where most first-timers race (55–70). From here it's about holding it and making the training race-specific.`;
    if (ramp != null) fy += ` Your current ramp is ${ramp} a week: ${ramp > 7 ? "too steep, that's where injuries come from." : ramp >= 3 ? "a good rate." : ramp > 0 ? "on the gentle side." : "you're losing fitness right now."}`;
    const vo2 = lastOf(T.vo2max);
    const blocks = [{ title: "Fitness and fatigue", note: "Last 90 days. The dotted line is 60, a solid fitness level to race on.", legend: [["Fitness", ""], ["Fatigue", "dash"]],
      draw: box => lineChart(box, { dates: T.dates, fmt: x => Math.round(x), refs: [{ value: 60, dash: "1 4" }], series: [
        { label: "Fitness", values: T.ctl, color: "var(--ink)" }, { label: "Fatigue", values: T.atl, color: "var(--ink-3)", dash: "5 4" }] }) }];
    if (vo2 != null) blocks.push({ title: "VO2 max", note: "Garmin's estimate from your runs. Rough, so watch the direction rather than the number.", height: 160,
      draw: box => lineChart(box, { dates: T.dates, fmt: x => x.toFixed(0), yRange: [Math.min(...T.vo2max.filter(x => x != null)) - 3, Math.max(...T.vo2max.filter(x => x != null)) + 3],
        series: [{ label: "VO2 max", values: T.vo2max, color: "var(--ink)", connect: true }] }) });
    return {
      title: "Fitness", big: ctl == null ? "–" : `${Math.round(ctl)}`, ctx: `Fatigue ${atl == null ? "–" : Math.round(atl)}, ramp ${ramp ?? "–"} a week${vo2 != null ? `, VO2 max ${vo2.toFixed(0)}` : ""}`,
      blocks,
      meaning: "Fitness is your training load averaged over the last 6 weeks, so it rises slowly as you string good weeks together. Fatigue is the same over the last 7 days, so it spikes after big sessions and drops fast when you rest. The higher your fitness on race day, the more you can hold for 5 hours." + (vo2 != null ? " For VO2 max, untrained young guys sit roughly 40–45, trained endurance athletes 55–65+." : ""),
      forYou: fy,
      table: tableHtml(T.dates.slice(-30), [["Fitness", T.ctl.slice(-30), x => Math.round(x)], ["Fatigue", T.atl.slice(-30), x => Math.round(x)], ["Form", T.form.slice(-30), x => sgn(x)]]),
    };
  },

  form(d) {
    const T = d.trends, f = lastOf(T.form), z = formZone(f);
    const advice = {
      "Building fitness": "You're carrying training fatigue, which is exactly what a building block looks like. Keep most days easy and it stays productive.",
      "Fresh": "You're fresh. Perfect before a test or race. If it stays here for more than a week, you're not training enough to improve.",
      "Grey zone": "Not much training stress right now, so not much fitness gain either. Fine for a recovery week, otherwise time to push on.",
      "High strain": "You're deep in fatigue. Take the next 2–3 days easy or off, then check again.",
      "Very fresh, fitness slipping": "You've backed right off. Fine after a race, otherwise it's time to build again.",
    }[z.label] || "Form fills in once there's a few weeks of training data.";
    return {
      title: "Form", big: sgn(f), ctx: z.label,
      blocks: [{ title: "Form, last 90 days", note: "Shaded zones show what each range means.", legend: [["Form", ""]], height: 240,
        draw: box => lineChart(box, { dates: T.dates, fmt: x => sgn(x), yRange: [-35, 25], refs: [{ value: 0, dash: "2 3", color: "var(--ink-3)" }],
          zones: [{ from: 25, to: 99, label: "Very fresh", color: "var(--easy)" }, { from: 5, to: 25, label: "Fresh", color: "var(--go)" },
                  { from: -10, to: 5, label: "Grey zone", color: "var(--ink-3)" }, { from: -30, to: -10, label: "Building", color: "var(--go)" },
                  { from: -99, to: -30, label: "High strain", color: "var(--rest)" }],
          series: [{ label: "Form", values: T.form, color: "var(--ink)" }] }) }],
      meaning: "Form is fitness minus fatigue. Below zero means you're carrying training fatigue, which is normal and productive between −10 and −30. Above zero means you're fresh. You want to arrive on race day at roughly +5 to +20, and that's what the taper in late February is for.",
      forYou: advice,
      table: tableHtml(T.dates.slice(-30), [["Form", T.form.slice(-30), x => sgn(x)]]),
    };
  },

  run(d) {
    const T = d.trends, pts = T.run_eff || [], st = engine(pts);
    const diff = st && st.then != null ? Math.round(st.now - st.then) : null;
    const fy = !st ? "No runs with heart rate in the last 90 days yet."
      : (diff == null ? `Based on ${st.n} runs so far. Give it a few more weeks for a real trend.`
        : diff <= -3 ? `${-diff}s/km faster than 4 weeks ago at the same heart rate. Your aerobic engine is improving.`
        : diff >= 3 ? `${diff}s/km slower than 4 weeks ago at the same heart rate. Usually fatigue, heat or hillier routes. Check Recovery; if that's fine too, it's noise.`
        : "About the same as 4 weeks ago. Normal while your hours shift onto the bike. It should start dropping as the easy miles add up.")
        + " Keeping your easy runs genuinely easy is what moves this number.";
    return {
      title: "Run engine", big: st ? `${mmss(st.now)}<small>/km</small>` : "–", ctx: "Estimated pace you'd hold at 145 bpm, averaged over your last 5 runs",
      blocks: [{ title: "Pace at 145 bpm", note: "Each dot is a run. Faster is higher up.", legend: [["5-run average", ""], ["Single run", "dot"]],
        draw: box => lineChart(box, { dates: T.dates, invert: true, fmt: mmss, unit: "/km", empty: "Needs runs with heart rate.", series: [
          { label: "5-run average", values: st ? onAxis(T.dates, st.roll) : [], color: "var(--ink)", connect: true },
          { label: "This run", values: onAxis(T.dates, pts), color: "var(--ink-3)", kind: "dots" }],
          extra: i => pts.filter(p => p.date === T.dates[i]).map(p => `<br><span style="color:var(--ink-3)">Ran ${mmss(p.pace)}/km at ${p.hr} bpm, ${p.km} km</span>`).join("") }) }],
      meaning: "Your easy-running engine. For every run with heart rate, I estimate the pace you'd hold at 145 bpm from your actual pace, average heart rate and resting heart rate. If it gets faster over weeks, your aerobic fitness is improving, even if easy runs feel the same. Single runs are noisy (hills, heat, wind), so watch the line, not the dots.",
      forYou: fy,
      table: st ? `<table><tr><th>Run</th><th>At 145 bpm</th><th>Actual</th><th>Avg HR</th><th>km</th></tr>${[...pts].reverse().map(p => `<tr><td>${dayShort(p.date)} ${dayMon(p.date)}</td><td>${mmss(p.value)}</td><td>${mmss(p.pace)}</td><td>${p.hr}</td><td>${p.km}</td></tr>`).join("")}</table>` : "",
    };
  },

  bike(d) {
    const T = d.trends, pts = T.bike_eff || [], st = engine(pts);
    const diff = st && st.then != null ? Math.round(st.now - st.then) : null;
    const fy = !st ? "No rides with heart rate and power yet. Keep the watch broadcasting HR to Zwift on every ride."
      : st.n < 5 ? `Only ${st.n} ride${st.n === 1 ? "" : "s"} so far, so there's no trend yet. After 5 or 6 rides with heart rate this becomes your best cycling fitness tracker, and once you've done the FTP test it'll line up with your power zones.`
      : diff == null ? "Give it a few more weeks for a 4-week comparison."
      : diff >= 5 ? `Up ${diff}W at the same heart rate over 4 weeks. The bike fitness is coming.` : diff <= -5 ? `Down ${-diff}W over 4 weeks. Check Recovery, it's usually fatigue.` : "Flat over 4 weeks. Longer easy rides are what moves this.";
    return {
      title: "Bike engine", big: st ? `${Math.round(st.now)}<small>W</small>` : "–", ctx: "Estimated power you'd hold at 135 bpm, averaged over your last 5 rides",
      blocks: [{ title: "Power at 135 bpm", note: "Each dot is a ride.", legend: [["5-ride average", ""], ["Single ride", "dot"]],
        draw: box => lineChart(box, { dates: T.dates, fmt: x => Math.round(x), unit: "W", empty: "Needs rides with heart rate.", series: [
          { label: "5-ride average", values: st ? onAxis(T.dates, st.roll) : [], color: "var(--ink)", connect: true },
          { label: "This ride", values: onAxis(T.dates, pts), color: "var(--ink-3)", kind: "dots" }],
          extra: i => pts.filter(p => p.date === T.dates[i]).map(p => `<br><span style="color:var(--ink-3)">Rode ${p.watts}W at ${p.hr} bpm, ${p.min} min</span>`).join("") }) }],
      meaning: "Same idea as the run engine, for the bike: the power you'd hold at an easy 135 bpm, estimated from each ride's power and heart rate. As your cycling fitness builds, you make more watts for the same heartbeat.",
      forYou: fy,
      table: st ? `<table><tr><th>Ride</th><th>At 135 bpm</th><th>Power</th><th>Avg HR</th><th>Min</th></tr>${[...pts].reverse().map(p => `<tr><td>${dayShort(p.date)} ${dayMon(p.date)}</td><td>${p.value}W</td><td>${p.watts}W</td><td>${p.hr}</td><td>${p.min}</td></tr>`).join("")}</table>` : "",
    };
  },

  volume(d) {
    const W = d.load.weeks, last = W[W.length - 2], prev = W[W.length - 3];
    const change = prev && prev.total ? Math.round((last.total / prev.total - 1) * 100) : null;
    const bikeShare = last.total ? Math.round(100 * last.hours.Bike / last.total) : 0;
    const fy = `Last week was ${fmtH(last.total)}${change != null ? `, ${change >= 0 ? "up" : "down"} ${Math.abs(change)}% on the week before` : ""}. `
      + (change != null && change > 15 ? "That's a big jump. Build 5–10% a week, with an easier week every 3–4 weeks. " : "")
      + `The bike was ${bikeShare}% of it. By January you want it near half your hours, because it's half your race.`;
    const starts = W.map(w => w.start);
    return {
      title: "Training volume", big: fmtH(W[W.length - 1].total), ctx: `This week so far. Last week ${fmtH(last.total)}.`,
      blocks: [
        { title: "Hours per week, last 12 weeks", legendRaw: sportLegend(), height: 240, draw: box => drawLoad(box, W, 240) },
        { title: "Easy share of bike and run time", note: "The line is the 80% target. Swims aren't counted, wrist HR is useless in the pool.", legend: [["Easy %", "bar"]], height: 170,
          draw: box => lineChart(box, { dates: starts, zeroBase: true, yRange: [0, 100], yMax: 100, fmt: x => Math.round(x) + "%", refs: [{ value: 80, dash: "5 4" }],
            dateLabel: s => `Week of ${dayMon(s)}`, series: [{ label: "Easy", values: W.map(w => w.easy_pct), color: "var(--ink-2)", kind: "bars", warnBelow: 70 }] }) },
      ],
      meaning: "Hours per week by sport. Fitness comes from stacking consistent weeks, not from one big one. A good pattern is three building weeks, then an easier one.",
      forYou: fy,
      table: `<table><tr><th>Week of</th><th>Swim</th><th>Bike</th><th>Run</th><th>Total</th><th>Easy</th></tr>${[...W].reverse().map(w =>
        `<tr><td>${dayMon(w.start)}</td><td>${fmtH(w.hours.Swim)}${w.km ? `, ${w.km.Swim} km` : ""}</td><td>${fmtH(w.hours.Bike)}${w.km ? `, ${w.km.Bike} km` : ""}</td><td>${fmtH(w.hours.Run)}${w.km ? `, ${w.km.Run} km` : ""}</td><td>${fmtH(w.total)}</td><td>${w.easy_pct == null ? "–" : w.easy_pct + "%"}</td></tr>`).join("")}</table>`,
    };
  },
};

function openMetric(key) {
  if (!DATA || !DATA.trends || !VIEWS[key]) return;
  const dlg = $("#metric"), v = VIEWS[key](DATA);
  lastView = key;
  $("#mTitle").textContent = v.title;
  $(".m-wrap", dlg).innerHTML = `
    <div class="m-top"><div class="m-big">${v.big}</div><div class="m-ctx">${v.ctx || ""}</div></div>
    ${v.blocks.map((b, i) => `<div class="m-block">${b.title ? `<h3>${esc(b.title)}</h3>` : ""}${b.note ? `<p class="m-note">${esc(b.note)}</p>` : ""}${b.legendRaw || (b.legend ? legendHtml(b.legend) : "")}<div class="m-chart" id="mc${i}" style="height:${b.height || 220}px"></div></div>`).join("")}
    <div class="m-text"><h3>What it is</h3><p>${esc(v.meaning)}</p><h3>For you right now</h3><p>${esc(v.forYou)}</p></div>
    ${v.table ? `<details class="table"><summary>Show as table</summary>${v.table}</details>` : ""}`;
  if (!dlg.open) { dlg.showModal(); dlg.scrollTop = 0; }
  requestAnimationFrame(() => v.blocks.forEach((b, i) => b.draw($("#mc" + i))));
}

(() => {
  const dlg = $("#metric");
  $(".m-close", dlg).addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => { tipOff(); lastView = null; });
  document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openMetric(b.dataset.open); });
})();

let rz; addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { drawCharts(); if ($("#metric").open && lastView) openMetric(lastView); }, 150);
});
load();
</script>
</body>
</html>
